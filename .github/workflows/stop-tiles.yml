# Builds the static stop tiles for "Departures near me" from the Metro GTFS
# feed and publishes them to GitHub Pages.
#
# Schedule: once daily at 02:17 UTC (15:17 NZDT in summer, 14:17 NZST in
# winter), after the feed's observed daily update at about 00:46 UTC. GitHub
# may delay scheduled runs. The decision logic lives in
# tools/stoptiles/deploy_decision.py so that it can be unit tested locally.
#
# Repository prerequisites:
#   * Secret METRO_GTFS_KEY: a Metro subscription key for the GTFS feed. It is
#     separate from the key compiled into the app.
#   * Settings > Pages > Source: "GitHub Actions".
#   * Optional repository variables (Settings > Variables) to tune the sanity
#     check without editing this file: STOP_TILES_MAX_DROP_PERCENT (default 10)
#     and STOP_TILES_MIN_STOPS (default 1800).
#   * Settings > General > Features > Issues must be enabled for the failure
#     alert below to be able to open an issue.
#
# Smoke test (job smoke-test): after a deploy, fetches the published meta.json
# and the tile of stop 53090 (a Bus Interchange platform; its tile id is
# computed from the build output, not hard-coded) and fails the run on a
# missing or non-JSON response, an oversized tile, a missing stop, or an h/gv
# mismatch. It retries for about 8 minutes to allow for CDN propagation. It
# also asserts that a tile far outside coverage returns 404: that is why the
# watch sees responseCode -400 there. The assertions live in
# tools/stoptiles/smoke_test.py and are unit tested.
#
# Failure alerting (job alert), scheduled runs only.
#   Verified (GitHub docs, "Notifications for workflow runs",
#   https://docs.github.com/en/actions/concepts/workflows-and-actions/notifications-for-workflow-runs):
#   notifications for a scheduled workflow go to one user: the user who
#   initially created the workflow, or, if a different user changes the cron
#   syntax, that user; after a disable and re-enable, the user who re-enabled
#   it. Runs you trigger yourself (push, manual) notify you. A failure
#   notification is only sent when that user has Actions notifications enabled.
#   Not verified: that this reaches a human reliably. It depends on one
#   person's notification settings and on who GitHub considers the actor, and a
#   run that never starts (see the keep-alive notes) produces no notification
#   at all. So when a scheduled run fails, job alert also opens, or comments
#   on, an issue titled "Stop tiles workflow failed" (tools/stoptiles/
#   report_failure.py) using GITHUB_TOKEN with issues: write in that job only.
#   The issue is not closed automatically.
#
# Keep-alive (job keepalive), scheduled runs only.
#   Verified (GitHub docs, "Events that trigger workflows", schedule event):
#   in a public repository, scheduled workflows are automatically disabled
#   when no repository activity has occurred in 60 days. Verified (REST docs,
#   "Enable a workflow"): PUT /repos/{owner}/{repo}/actions/workflows/{id}/
#   enable sets the workflow to active and needs the Actions: write permission.
#   Chosen mechanism: each scheduled run calls that endpoint for this workflow
#   (tools/stoptiles/keepalive.py, no third-party action, no commit).
#   Not verified (undocumented by GitHub): that enabling an already enabled
#   workflow restarts the 60 day clock, what exactly counts as "repository
#   activity", and whether the successful scheduled runs or the enable call
#   count as activity. The pattern is the one used by the community action
#   liskin/gh-workflow-keepalive, which makes the same call. Limit: this job
#   lives in the workflow it protects, so it cannot rescue a workflow that is
#   already disabled. Re-enable that one by hand (Actions tab, or
#   `gh workflow enable stop-tiles.yml`); notifications then go to whoever
#   re-enabled it. Dummy commits are deliberately not used.
name: Stop tiles

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even if the stop data and generator version are unchanged'
        type: boolean
        default: false
  push:
    branches:
      - master
    paths:
      - 'tools/stoptiles/**'
      - '.github/workflows/stop-tiles.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GTFS_URL: https://apis.metroinfo.co.nz/rti/gtfs/v1/gtfs.zip
  # Reference stop for the smoke test: a Bus Interchange platform.
  SMOKE_STOP_CODE: '53090'
  # A tile far outside coverage (latitude 0, longitude 0): must be a 404.
  SMOKE_OUTSIDE_TILE: t/0/0.json
  # A stop count drop of more than this percentage versus the deployed meta.json
  # fails the run, as does a count below the absolute floor.
  MAX_DROP_PERCENT: ${{ vars.STOP_TILES_MAX_DROP_PERCENT || '10' }}
  MIN_STOPS: ${{ vars.STOP_TILES_MIN_STOPS || '1800' }}
  FORCE: ${{ inputs.force && 'true' || 'false' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.decide.outputs.deploy || 'false' }}
      # What the smoke test expects the published site to contain.
      h: ${{ steps.smoke_values.outputs.h }}
      gv: ${{ steps.smoke_values.outputs.gv }}
      tile: ${{ steps.smoke_values.outputs.tile }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run generator unit tests
        run: python3 -m unittest discover tools/stoptiles

      - name: Read the deployed meta.json
        id: deployed
        env:
          # Pages hostnames are lower case. The run id defeats CDN caching.
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stoptiles"
          url="https://${OWNER,,}.github.io/${REPO}/meta.json?run=${GITHUB_RUN_ID}"
          code=$(curl --silent --show-error --max-time 60 --retry 3 \
            --header 'Cache-Control: no-cache' \
            --output "$RUNNER_TEMP/stoptiles/deployed-meta.json" \
            --write-out '%{http_code}' "$url")
          python3 tools/stoptiles/deploy_decision.py classify-deployed \
            --http-code "$code" | tee -a "$GITHUB_OUTPUT"
          if [ "$code" != 200 ]; then
            rm -f "$RUNNER_TEMP/stoptiles/deployed-meta.json"
          fi

      - name: Plan the gtfs.zip request
        id: plan
        run: |
          set -euo pipefail
          python3 tools/stoptiles/deploy_decision.py plan-fetch \
            --deployed "$RUNNER_TEMP/stoptiles/deployed-meta.json" \
            --force "$FORCE" | tee -a "$GITHUB_OUTPUT"

      - name: Fetch gtfs.zip
        id: fetch
        env:
          METRO_GTFS_KEY: ${{ secrets.METRO_GTFS_KEY }}
          IF_NONE_MATCH: ${{ steps.plan.outputs.if_none_match }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          set -euo pipefail
          : "${METRO_GTFS_KEY:?the METRO_GTFS_KEY secret is not set}"
          work="$RUNNER_TEMP/stoptiles"
          # Request headers go to curl on stdin so the key never appears in
          # argv or output. 304 is not a curl error, so --fail still rejects
          # every 4xx and 5xx while a conditional request can return 304.
          code=$({
            printf 'Ocp-Apim-Subscription-Key: %s\n' "$METRO_GTFS_KEY"
            if [ "$MODE" = conditional ]; then
              printf 'If-None-Match: %s\n' "$IF_NONE_MATCH"
            fi
          } | curl --silent --show-error --fail --max-time 300 --retry 3 \
            --header @- \
            --dump-header "$work/gtfs-response-headers.txt" \
            --output "$work/gtfs.zip" \
            --write-out '%{http_code}' "$GTFS_URL")
          conditional=false
          if [ "$MODE" = conditional ]; then conditional=true; fi
          python3 tools/stoptiles/deploy_decision.py classify-fetch \
            --http-code "$code" --conditional "$conditional" \
            --file "$work/gtfs.zip" | tee -a "$GITHUB_OUTPUT"
          if [ "$code" = 200 ]; then
            python3 tools/stoptiles/deploy_decision.py etag \
              "$work/gtfs-response-headers.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the tiles
        if: steps.fetch.outputs.result == 'download'
        env:
          ETAG: ${{ steps.fetch.outputs.etag }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stoptiles"
          # The deployed meta.json is deliberately not passed as
          # --previous-meta: it is only a log line, and the generator fails on
          # a file that is valid JSON but not an object. deploy_decision.py
          # treats such a file as having no baseline, so passing it here would
          # stop the run before a repaired meta.json could be published.
          python3 tools/stoptiles/generate_tiles.py "$work/gtfs.zip" site \
            --etag "$ETAG"

      - name: Sanity check and decide whether to deploy
        id: decide
        if: steps.fetch.outputs.result == 'download'
        run: |
          set -euo pipefail
          python3 tools/stoptiles/deploy_decision.py decide \
            --new site/meta.json \
            --deployed "$RUNNER_TEMP/stoptiles/deployed-meta.json" \
            --force "$FORCE" \
            --max-drop-percent "$MAX_DROP_PERCENT" \
            --min-stops "$MIN_STOPS" | tee -a "$GITHUB_OUTPUT"

      - name: Record the values the smoke test expects
        id: smoke_values
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          python3 tools/stoptiles/smoke_test.py build-values \
            --site site --stop "$SMOKE_STOP_CODE" | tee -a "$GITHUB_OUTPUT"

      - name: Summarise
        env:
          FETCH_RESULT: ${{ steps.fetch.outputs.result }}
          DEPLOY: ${{ steps.decide.outputs.deploy }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "$FETCH_RESULT" = unchanged ]; then
            echo 'gtfs.zip is unchanged (HTTP 304): nothing to deploy.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deploy: ${DEPLOY} (${REASON})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the Pages artifact
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke-test:
    needs: [build, deploy]
    # Only after a deploy that actually happened and succeeded: the implicit
    # success() also skips this job when the deploy job failed or was skipped.
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out the smoke test script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/stoptiles

      - name: Smoke test the published tiles
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EXPECTED_H: ${{ needs.build.outputs.h }}
          EXPECTED_GV: ${{ needs.build.outputs.gv }}
          TILE: ${{ needs.build.outputs.tile }}
        run: |
          set -euo pipefail
          python3 tools/stoptiles/smoke_test.py check \
            --base-url "https://${OWNER,,}.github.io/${REPO}" \
            --expect-h "$EXPECTED_H" \
            --expect-gv "$EXPECTED_GV" \
            --tile "$TILE" \
            --stop "$SMOKE_STOP_CODE" \
            --outside-path "$SMOKE_OUTSIDE_TILE" \
            --max-seconds 480 --delay 30 \
            --cache-bust "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  keepalive:
    # Independent of the build, so that it also runs when the build fails.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the keep-alive script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/stoptiles

      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/stoptiles/keepalive.py

  alert:
    needs: [build, deploy, smoke-test, keepalive]
    # A failed or timed-out (reported as cancelled) job in a scheduled run.
    # Manual and push runs notify the person who started them.
    if: >-
      ${{ always() && github.event_name == 'schedule'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the alert script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/stoptiles

      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          KEEPALIVE_RESULT: ${{ needs.keepalive.result }}
        run: |
          set -euo pipefail
          python3 tools/stoptiles/report_failure.py \
            --run-url "$RUN_URL" --event "$EVENT" --ref "$REF" --sha "$SHA" \
            --result "build=$BUILD_RESULT" \
            --result "deploy=$DEPLOY_RESULT" \
            --result "smoke-test=$SMOKE_RESULT" \
            --result "keepalive=$KEEPALIVE_RESULT"
